name: DevSecOps Pipeline

on:
  pull_request:

jobs:

  # =========================
  # 1. ATTACH WAF FIRST
  # =========================
  attach-waf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Attach WAF policy (XC)
        env:
          XC_API_TOKEN: ${{ secrets.XC_API_TOKEN }}
        run: python scripts/xc_waf.py

  # =========================
  # 2. RUN SCAN + MONITOR
  # =========================
  security-scan:
    needs: attach-waf
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      # 🔥 Lanzar scan en background
      - name: Start Heyhack scan
        env:
          HEYHACK_API_KEY: ${{ secrets.HEYHACK_API_KEY }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
        run: |
          echo "🚀 Starting Heyhack scan..."
          python scripts/heyhack_scan.py &

      # 🔥 Monitor en foreground (fail fast)
      - name: Monitor findings (fail fast)
        env:
          HEYHACK_API_KEY: ${{ secrets.HEYHACK_API_KEY }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          CVSS_THRESHOLD: 8
          CHECK_INTERVAL: 30
        run: |
          echo "🔍 Monitoring findings..."
          python scripts/heyhack_monitor.py