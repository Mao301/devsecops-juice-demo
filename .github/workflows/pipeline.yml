name: DevSecOps Pipeline

on:
  pull_request:

jobs:

  # =========================
  # 1. ATTACH WAF FIRST
  # =========================
  attach-waf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout security repo
        uses: actions/checkout@v4
        with:
          repository: Mao301/security-policies
          token: ${{ secrets.GH_PAT }}
          path: security

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Apply WAF policy from security repo
        env:
          XC_API_TOKEN: ${{ secrets.XC_API_TOKEN }}
        run: python security/scripts/xc_waf.py


  # =========================
  # 2. SECURITY SCAN + MONITOR
  # =========================
  security-scan:
    needs: attach-waf
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout security repo
        uses: actions/checkout@v4
        with:
          repository: Mao301/security-policies
          token: ${{ secrets.GH_PAT }}
          path: security

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      # 🚀 Start scan (background)
      - name: Start Heyhack scan
        env:
          HEYHACK_API_KEY: ${{ secrets.HEYHACK_API_KEY }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
        run: |
          echo "🚀 Starting Heyhack scan..."
          python security/scripts/heyhack_scan.py &

      # 🔍 Monitor (foreground - fail fast)
      - name: Monitor findings (fail fast)
        env:
          HEYHACK_API_KEY: ${{ secrets.HEYHACK_API_KEY }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          CVSS_THRESHOLD: 11   # puedes bajar a 8 cuando quieras
          CHECK_INTERVAL: 30
        run: |
          echo "🔍 Monitoring findings..."
          python -u security/scripts/heyhack_monitor.py